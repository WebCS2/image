<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auth UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1020;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      padding: 0 10px;
    }

    .box {
      background: #1b1d36;
      padding: 30px;
      border-radius: 14px;
      width: 340px;
      max-width: 100%;
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
      border-radius: 10px;
      overflow: hidden;
    }

    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      background: #0f1020;
      font-size: 16px;
    }

    .tab.active {
      background: #3b3f7a;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #3b3f7a;
      color: white;
      font-size: 16px;
    }

    #dashboard {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      background: #0f1020;
    }

    .topbar {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    .logout {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 6px 12px;
      background: #3b3f7a;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 14px;
      width: auto;
    }

    /* 📱 MOBILE USERS GET BIGGER UI */
    @media (max-width: 480px) {
      .box {
        width: 95%;
        padding: 35px;
      }

      .tab {
        font-size: 18px;
        padding: 14px;
      }

      input {
        font-size: 18px;
        padding: 16px;
      }

      button {
        font-size: 18px;
        padding: 16px;
      }

      .topbar {
        font-size: 24px;
      }

      .logout {
        font-size: 14px;
        padding: 7px 14px;
      }
    }

  </style>
</head>
<body>

<div class="box" id="auth">
  <div class="tabs">
    <div class="tab active" id="signupTab" onclick="setMode(true)">Sign up</div>
    <div class="tab" id="loginTab" onclick="setMode(false)">Sign in</div>
  </div>

  <input type="text" id="username" placeholder="Username" maxlength="10">
  <input type="password" id="password" placeholder="Password">

  <button onclick="submitForm()" id="actionBtn">Sign up</button>
</div>

<div id="dashboard">
  <div class="topbar">
    <span id="displayName"></span>
  </div>

  <button class="logout" onclick="logout()">Log out</button>
</div>

<script>
  let isSignup = true;

  function setMode(signup) {
    isSignup = signup;
    document.getElementById('signupTab').classList.toggle('active', signup);
    document.getElementById('loginTab').classList.toggle('active', !signup);
    document.getElementById('actionBtn').innerText = signup ? 'Sign up' : 'Sign in';
  }

  function getUsers() {
    return JSON.parse(localStorage.getItem('users') || '[]');
  }

  function saveUsers(users) {
    localStorage.setItem('users', JSON.stringify(users));
  }

  function submitForm() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      alert('Fill all fields');
      return;
    }

    if (username.length > 10) {
      alert("Username must be 10 characters or less");
      return;
    }

    const users = getUsers();

    if (isSignup) {
      const exists = users.find(u => u.username.toLowerCase() === username.toLowerCase());
      if (exists) {
        alert('Username already taken');
        return;
      }

      users.push({ username, password });
      saveUsers(users);
      localStorage.setItem('currentUser', JSON.stringify({ username }));
      showDashboard(username);

    } else {
      const user = users.find(u => u.username === username && u.password === password);

      if (!user) {
        alert('Invalid login');
        return;
      }

      localStorage.setItem('currentUser', JSON.stringify({ username: user.username }));
      showDashboard(user.username);
    }
  }

  function showDashboard(name) {
    document.getElementById('auth').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('displayName').innerText = name;
  }

  function logout() {
    localStorage.removeItem('currentUser');
    document.getElementById('auth').style.display = 'block';
    document.getElementById('dashboard').style.display = 'none';
  }

  window.onload = function() {
    const current = JSON.parse(localStorage.getItem('currentUser'));
    if (current) {
      showDashboard(current.username);
    }
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auth UI + Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1020;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 0 10px;
    }

    .box {
      background: #1b1d36;
      padding: 30px;
      border-radius: 14px;
      width: 340px;
      max-width: 100%;
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
      border-radius: 10px;
      overflow: hidden;
    }

    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      background: #0f1020;
      font-size: 16px;
    }

    .tab.active {
      background: #3b3f7a;
    }

    input, select {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #3b3f7a;
      color: white;
      font-size: 16px;
    }

    #dashboard {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      background: #0f1020;
    }

    .topbar {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    .logout {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 6px 12px;
      background: #3b3f7a;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      width: auto;
    }

    .coinFrame, .adminPanel {
      position: absolute;
      top: 80px;
      left: 20px;
      width: 200px;
      background: #1b1d36;
      padding: 15px;
      border-radius: 10px;
    }

    .coinGame {
      display: none;
      position: absolute;
      top: 80px;
      left: 240px;
      width: 260px;
      background: #1b1d36;
      padding: 20px;
      border-radius: 10px;
    }

    .adminPanel {
      display: none;
      top: 80px;
      left: 520px;
      width: 260px;
    }

    @media (max-width: 480px) {
      .coinFrame { width: 150px; left: 10px; padding: 10px; }
      .coinGame { width: 150px; left: 170px; padding: 10px; }
      .adminPanel { width: 95%; left: 10px; top: 260px; }
    }
  </style>
</head>
<body>

<!-- AUTH BOX -->
<div class="box" id="auth">
  <div class="tabs">
    <div class="tab active" id="signupTab" onclick="setMode(true)">Sign up</div>
    <div class="tab" id="loginTab" onclick="setMode(false)">Sign in</div>
  </div>

  <input type="text" id="username" placeholder="Username" maxlength="10">
  <input type="password" id="password" placeholder="Password">

  <button onclick="submitForm()" id="actionBtn">Sign up</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="topbar">
    <span id="displayName"></span> — <span id="coinsDisplay"></span> Bytecoins
  </div>

  <button class="logout" onclick="logout()">Log out</button>

  <!-- COIN FLIP FRAME -->
  <div class="coinFrame">
    <h3>Coin Flip</h3>
    <button onclick="toggleCoinFlip()">Play</button>
  </div>

  <!-- COIN GAME -->
  <div class="coinGame" id="coinGame">
    <h3>Coin Flip</h3>

    <button onclick="setPick('heads')">Heads</button>
    <button onclick="setPick('tails')">Tails</button>

    <p id="pickText">Pick: none</p>

    <input type="number" id="betAmount" placeholder="Bet amount">

    <button onclick="playCoinFlip()">Flip</button>

    <p id="resultText"></p>
  </div>

  <!-- ADMIN PANEL -->
  <div class="adminPanel" id="adminPanel">
    <h3>Admin Panel</h3>

    <h4>Ban User (Permanent)</h4>
    <input id="banUser" placeholder="Username">
    <button onclick="banUser()">Ban</button>

    <h4>Timeout User</h4>
    <input id="timeoutUser" placeholder="Username">
    <input id="timeoutMinutes" type="number" placeholder="Minutes">
    <button onclick="timeoutUserFunc()">Timeout</button>

    <h4>Edit Bytecoins</h4>
    <input id="editUser" placeholder="Username">
    <input id="editAmount" type="number" placeholder="Amount (+/-)">
    <button onclick="editCoins()">Apply</button>

    <h4>Reset Password</h4>
    <input id="resetUser" placeholder="Username">
    <input id="newPass" placeholder="New Password">
    <button onclick="resetPassword()">Reset</button>

    <h4>View Users</h4>
    <button onclick="viewUsers()">Show List</button>
    <p id="userList"></p>
  </div>

</div>

<script>
  let isSignup = true;
  let currentPick = null;

  function setMode(signup) {
    isSignup = signup;
    document.getElementById('signupTab').classList.toggle('active', signup);
    document.getElementById('loginTab').classList.toggle('active', !signup);
    document.getElementById('actionBtn').innerText = signup ? 'Sign up' : 'Sign in';
  }

  function getUsers() {
    return JSON.parse(localStorage.getItem('users') || '[]');
  }

  function saveUsers(users) {
    localStorage.setItem('users', JSON.stringify(users));
  }

  function submitForm() {
    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    if (!username || !password) return alert("Fill all fields");

    let users = getUsers();

    if (isSignup) {
      if (users.some(u => u.username.toLowerCase() === username.toLowerCase()))
        return alert("Username already taken");

      users.push({ username, password, bytecoins: 10 });
      saveUsers(users);
      localStorage.setItem("currentUser", username);
      showDashboard(username);
      return;
    }

    const user = users.find(u => u.username === username && u.password === password);

    if (!user) return alert("Invalid login");

    if (user.timeout && Date.now() < user.timeout)
      return alert("You are timed out");

    localStorage.setItem("currentUser", username);
    showDashboard(username);
  }

  function showDashboard(name) {
    auth.style.display = "none";
    dashboard.style.display = "block";

    const users = getUsers();
    const user = users.find(u => u.username === name);

    displayName.innerText = name;
    coinsDisplay.innerText = user.bytecoins;

    adminPanel.style.display = (name.toLowerCase() === "krooks") ? "block" : "none";
  }

  function logout() {
    localStorage.removeItem("currentUser");
    auth.style.display = "block";
    dashboard.style.display = "none";
  }

  window.onload = () => {
    const current = localStorage.getItem("currentUser");
    if (current) showDashboard(current);
  };

  function toggleCoinFlip() {
    coinGame.style.display = (coinGame.style.display === "block") ? "none" : "block";
  }

  function setPick(p) {
    currentPick = p;
    pickText.innerText = "Pick: " + p;
  }

  function playCoinFlip() {
    const bet = parseInt(betAmount.value);
    if (!currentPick) return alert("Pick heads or tails");
    if (!bet || bet <= 0) return alert("Enter valid bet");

    let users = getUsers();
    let name = localStorage.getItem("currentUser");
    let user = users.find(u => u.username === name);

    if (bet > user.bytecoins) return alert("Not enough Bytecoins");

    user.bytecoins -= bet;

    const flip = Math.random() < 0.5 ? "heads" : "tails";

    if (flip === currentPick) {
      const winnings = Math.floor(bet * 0.90);
      user.bytecoins += winnings;
      resultText.innerText = `You WON! Earned ${winnings}`;
    } else {
      resultText.innerText = `You lost!`;
    }

    saveUsers(users);
    coinsDisplay.innerText = user.bytecoins;
  }

  // ADMIN FUNCTIONS

  function banUser() {
    let name = banUserInput.value.trim();
    let users = getUsers();
    users = users.filter(u => u.username.toLowerCase() !== name.toLowerCase());
    saveUsers(users);
    alert("User permanently banned");
  }

  function timeoutUserFunc() {
    let name = timeoutUser.value.trim();
    let mins = parseInt(timeoutMinutes.value);
    let users = getUsers();
    let user = users.find(u => u.username.toLowerCase() === name.toLowerCase());
    if (!user) return alert("User not found");
    user.timeout = Date.now() + mins * 60000;
    saveUsers(users);
    alert("User timed out");
  }

  function editCoins() {
    let name = editUser.value.trim();
    let amount = parseInt(editAmount.value);
    let users = getUsers();
    let user = users.find(u => u.username.toLowerCase() === name.toLowerCase());
    if (!user) return alert("User not found");
    user.bytecoins += amount;
    saveUsers(users);
    alert("Updated coins");
  }

  function resetPassword() {
    let name = resetUser.value.trim();
    let pass = newPass.value;
    let users = getUsers();
    let user = users.find(u => u.username.toLowerCase() === name.toLowerCase());
    if (!user) return alert("User not found");
    user.password = pass;
    saveUsers(users);
    alert("Password reset");
  }

  function viewUsers() {
    let users = getUsers();
    userList.innerText = users.map(u => `${u.username} — ${u.bytecoins} BC`).join("\n");
  }
</script>

</body>
</html>

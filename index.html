<!DOCTYPE html>
<html>
<head>
<title>Pixelia Worlds</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  overflow: hidden;
  background: linear-gradient(#87CEEB, #cfefff);
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
}

/* NAME */
#nameBox {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

/* CHAT */
#chatContainer {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 260px;
  background: rgba(0,0,0,0.6);
  border-radius: 10px;
  padding: 10px;
  color: white;
  font-size: 14px;
}

#chatLog {
  height: 140px;
  overflow-y: auto;
}

#chatInput {
  width: 100%;
  padding: 6px;
  margin-top: 5px;
  box-sizing: border-box;
}

/* MOBILE CONTROLS */
#controls {
  position: absolute;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* JOYSTICK */
#joystick {
  position: absolute;
  bottom: 30px;
  left: 30px;
  width: 110px;
  height: 110px;
  background: rgba(0,0,0,0.2);
  border-radius: 50%;
  pointer-events: auto;
  touch-action: none;
}

#stick {
  width: 50px;
  height: 50px;
  background: rgba(0,0,0,0.5);
  border-radius: 50%;
  position: absolute;
  top: 30px;
  left: 30px;
  transition: transform 0.05s linear;
}

/* JUMP BUTTON */
#jumpBtn {
  position: absolute;
  bottom: 40px;
  right: 40px;
  width: 80px;
  height: 80px;
  background: rgba(0,0,0,0.4);
  border-radius: 50%;
  color: white;
  font-size: 18px;
  display: flex;
  justify-content: center;
  align-items: center;
  pointer-events: auto;
  touch-action: none;
  user-select: none;
}

/* Small screens: shrink controls a bit */
@media (max-width: 600px) {
  #joystick {
    width: 90px;
    height: 90px;
  }
  #stick {
    width: 40px;
    height: 40px;
    top: 25px;
    left: 25px;
  }
  #jumpBtn {
    width: 70px;
    height: 70px;
    font-size: 16px;
  }
}
</style>
</head>
<body>

<div id="nameBox">
  <h2>Enter name</h2>
  <input id="nameInput" maxlength="16">
  <button onclick="startGame()">Start</button>
</div>

<div id="chatContainer" style="display:none;">
  <div id="chatLog"></div>
  <input id="chatInput" placeholder="Enter = chat / commands">
</div>

<div id="controls">
  <div id="joystick"><div id="stick"></div></div>
  <div id="jumpBtn">JUMP</div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const tileSize = 32;
const cols = 50;
const rows = 30;

let keys = {};
let playerName = "";
let chatOpen = false;
let isAdmin = false;

// MOBILE INPUT
let moveDir = 0;
let jumpPressed = false;

// PARTICLES
let particles = [];

let player = {
  x: 5,
  y: 0,
  vx: 0,
  vy: 0,
  onGround: false,
  visible: true
};

let world = [];

// WORLD
function generateWorld() {
  for (let y = 0; y < rows; y++) {
    world[y] = [];
    for (let x = 0; x < cols; x++) {
      if (y === 15) world[y][x] = "grass";
      else if (y > 15 && y < 22) world[y][x] = "soil";
      else if (y >= 22) world[y][x] = "bedrock";
      else world[y][x] = "air";
    }
  }
}

// START
function startGame() {
  playerName = document.getElementById("nameInput").value.trim();
  if (!playerName) return;

  if (playerName === "Xolo") {
    isAdmin = true;
  }

  document.getElementById("nameBox").style.display = "none";
  document.getElementById("chatContainer").style.display = "block";

  generateWorld();
  respawnPlayer();

  gameLoop();
}

// PC CONTROLS
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && !chatOpen) {
    chatOpen = true;
    chatInput.focus();
    return;
  }
  if (!chatOpen) {
    keys[e.key.toLowerCase()] = true;
  }
});

document.addEventListener("keyup", e => {
  if (!chatOpen) {
    keys[e.key.toLowerCase()] = false;
  }
});

// CHAT
const chatInput = document.getElementById("chatInput");
const chatLog = document.getElementById("chatLog");

chatInput.addEventListener("keydown", e => {
  e.stopPropagation(); // prevent game from seeing keys while chatting

  if (e.key === "Enter") {
    const msg = chatInput.value.trim();
    if (msg) {
      // Admin commands
      if (isAdmin && msg.startsWith("/")) {
        handleAdminCommand(msg);
      } else {
        const displayName = isAdmin ? '<span style="color:purple">@Xolo</span>' : `<span>${playerName}</span>`;
        chatLog.innerHTML += `<div><b>${displayName}:</b> ${escapeHtml(msg)}</div>`;
        chatLog.scrollTop = chatLog.scrollHeight;
      }
    }
    chatInput.value = "";
    chatOpen = false;
    keys = {};
    chatInput.blur();
  }
});

function handleAdminCommand(cmd) {
  const parts = cmd.split(" ");
  const base = parts[0].toLowerCase();

  if (base === "/respawn") {
    respawnPlayer();
    chatLog.innerHTML += `<div style="color:#9cf;"><b>@Xolo:</b> respawned</div>`;
  } else if (base === "/invisible") {
    player.visible = !player.visible;
    chatLog.innerHTML += `<div style="color:#9cf;"><b>@Xolo:</b> invisible = ${player.visible}</div>`;
  } else {
    chatLog.innerHTML += `<div style="color:#f99;"><b>@Xolo:</b> unknown command</div>`;
  }
  chatLog.scrollTop = chatLog.scrollHeight;
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// MOBILE JOYSTICK
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let joyCenter = { x: 55, y: 55 }; // approx center
let joyActive = false;

function updateStickVisual(dx) {
  const maxOffset = 25;
  const clamped = Math.max(-maxOffset, Math.min(maxOffset, dx));
  stick.style.transform = `translate(${clamped}px, 0px)`;
}

joystick.addEventListener("touchstart", e => {
  joyActive = true;
});

joystick.addEventListener("touchmove", e => {
  e.preventDefault();
  let rect = joystick.getBoundingClientRect();
  let touch = e.touches[0];

  let x = touch.clientX - rect.left - joyCenter.x;

  if (x < -15) moveDir = -1;
  else if (x > 15) moveDir = 1;
  else moveDir = 0;

  updateStickVisual(x);
}, { passive: false });

joystick.addEventListener("touchend", () => {
  joyActive = false;
  moveDir = 0;
  stick.style.transform = "translate(0px,0px)";
});

// JUMP BUTTON (touch + click for PC)
const jumpBtn = document.getElementById("jumpBtn");

jumpBtn.addEventListener("touchstart", e => {
  e.preventDefault();
  jumpPressed = true;
}, { passive: false });

jumpBtn.addEventListener("touchend", e => {
  e.preventDefault();
  jumpPressed = false;
}, { passive: false });

jumpBtn.addEventListener("mousedown", () => {
  jumpPressed = true;
});
jumpBtn.addEventListener("mouseup", () => {
  jumpPressed = false;
});
jumpBtn.addEventListener("mouseleave", () => {
  jumpPressed = false;
});

// RESPAWN
function respawnPlayer() {
  player.x = 5;
  player.y = 14;
  player.vx = 0;
  player.vy = 0;
  player.onGround = false;
}

// PARTICLES
function spawnDust(x, y, count = 6) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x + tileSize / 2,
      y: y + tileSize,
      vx: (Math.random() - 0.5) * 2,
      vy: -Math.random() * 2,
      life: 20 + Math.random() * 10
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  particles.forEach(p => {
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  });
}

// UPDATE
function update() {
  const speed = 0.5;

  let left = keys["a"] || moveDir === -1;
  let right = keys["d"] || moveDir === 1;
  let jump = keys["w"] || jumpPressed || keys[" "];

  if (keys["r"]) {
    respawnPlayer();
  }

  if (left) player.vx = -speed;
  else if (right) player.vx = speed;
  else player.vx = 0;

  if (jump && player.onGround) {
    player.vy = -6;
    player.onGround = false;
    spawnDust(player.x * tileSize, player.y * tileSize);
  }

  player.vy += 0.3;

  player.x += player.vx;
  player.y += player.vy * 0.1;

  // BORDERS
  player.x = Math.max(0, Math.min(cols - 1, player.x));

  // FALL OFF WORLD -> respawn
  if (player.y > rows + 5) {
    respawnPlayer();
  }

  let below = Math.floor(player.y + 1);
  let px = Math.floor(player.x);

  if (world[below] && world[below][px] !== "air") {
    if (!player.onGround && player.vy > 0.2) {
      spawnDust(player.x * tileSize, (below - 1) * tileSize);
    }
    player.y = Math.floor(player.y);
    player.vy = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }

  updateParticles();
}

// DRAW
function drawWorld() {
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      let block = world[y][x];

      if (block === "grass") ctx.fillStyle = "#3cb043";
      else if (block === "soil") ctx.fillStyle = "#8b4513";
      else if (block === "bedrock") ctx.fillStyle = "#222";
      else continue;

      ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
    }
  }
}

function drawPlayer() {
  if (!player.visible) return;

  let px = player.x * tileSize;
  let py = player.y * tileSize;

  // body
  ctx.fillStyle = "red";
  ctx.fillRect(px, py, tileSize, tileSize);

  // eyes
  ctx.fillStyle = "white";
  ctx.fillRect(px + 6, py + 8, 6, 6);
  ctx.fillRect(px + 20, py + 8, 6, 6);

  // name
  ctx.font = "14px Arial";
  ctx.textBaseline = "bottom";
  ctx.textAlign = "center";
  if (isAdmin) {
    ctx.fillStyle = "purple";
    ctx.fillText("@Xolo", px + tileSize / 2, py - 4);
  } else {
    ctx.fillStyle = "black";
    ctx.fillText(playerName, px + tileSize / 2, py - 4);
  }
}

// LOOP
function gameLoop() {
  update();

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawWorld();
  drawParticles();
  drawPlayer();

  requestAnimationFrame(gameLoop);
}
</script>

</body>
</html>

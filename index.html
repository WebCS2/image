<!DOCTYPE html>
<html>
<head>
<title>2D Game Mobile + PC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  overflow: hidden;
  background: linear-gradient(#87CEEB, #cfefff);
  font-family: Arial;
}

canvas {
  display: block;
}

/* NAME */
#nameBox {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

/* CHAT */
#chatContainer {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 260px;
  background: rgba(0,0,0,0.6);
  border-radius: 10px;
  padding: 10px;
}

#chatLog {
  height: 120px;
  overflow-y: auto;
  color: white;
  font-size: 14px;
}

#chatInput {
  width: 100%;
  padding: 6px;
  margin-top: 5px;
}

/* MOBILE CONTROLS */
#controls {
  position: absolute;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* JOYSTICK */
#joystick {
  position: absolute;
  bottom: 30px;
  left: 30px;
  width: 100px;
  height: 100px;
  background: rgba(0,0,0,0.2);
  border-radius: 50%;
  pointer-events: auto;
}

#stick {
  width: 40px;
  height: 40px;
  background: rgba(0,0,0,0.5);
  border-radius: 50%;
  position: absolute;
  top: 30px;
  left: 30px;
}

/* JUMP BUTTON */
#jumpBtn {
  position: absolute;
  bottom: 40px;
  right: 40px;
  width: 80px;
  height: 80px;
  background: rgba(0,0,0,0.4);
  border-radius: 50%;
  color: white;
  font-size: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  pointer-events: auto;
}
</style>
</head>
<body>

<div id="nameBox">
  <h2>Enter name</h2>
  <input id="nameInput">
  <button onclick="startGame()">Start</button>
</div>

<div id="chatContainer" style="display:none;">
  <div id="chatLog"></div>
  <input id="chatInput" placeholder="Enter = chat">
</div>

<div id="controls">
  <div id="joystick"><div id="stick"></div></div>
  <div id="jumpBtn">JUMP</div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const tileSize = 32;
const cols = 50;
const rows = 30;

let keys = {};
let playerName = "";
let chatOpen = false;

// MOBILE INPUT
let moveDir = 0;
let jumpPressed = false;

let player = {
  x: 5,
  y: 0,
  vx: 0,
  vy: 0,
  onGround: false
};

let world = [];

// WORLD
function generateWorld() {
  for (let y = 0; y < rows; y++) {
    world[y] = [];
    for (let x = 0; x < cols; x++) {
      if (y === 15) world[y][x] = "grass";
      else if (y > 15 && y < 22) world[y][x] = "soil";
      else if (y >= 22) world[y][x] = "bedrock";
      else world[y][x] = "air";
    }
  }
}

// START
function startGame() {
  playerName = document.getElementById("nameInput").value;
  if (!playerName) return;

  document.getElementById("nameBox").style.display = "none";
  document.getElementById("chatContainer").style.display = "block";

  generateWorld();
  player.y = 14;

  gameLoop();
}

// PC CONTROLS
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && !chatOpen) {
    chatOpen = true;
    chatInput.focus();
    return;
  }
  if (!chatOpen) keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

// CHAT FIXED
const chatInput = document.getElementById("chatInput");
chatInput.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    if (chatInput.value.trim()) {
      chatLog.innerHTML += `<div><b>${playerName}:</b> ${chatInput.value}</div>`;
      chatLog.scrollTop = chatLog.scrollHeight;
    }
    chatInput.value = "";
    chatOpen = false;
    keys = {};
    chatInput.blur();
  }
});

// MOBILE JOYSTICK
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

joystick.addEventListener("touchmove", e => {
  let rect = joystick.getBoundingClientRect();
  let touch = e.touches[0];

  let x = touch.clientX - rect.left - 50;

  if (x < -20) moveDir = -1;
  else if (x > 20) moveDir = 1;
  else moveDir = 0;
});

joystick.addEventListener("touchend", () => {
  moveDir = 0;
});

// JUMP BUTTON
document.getElementById("jumpBtn").addEventListener("touchstart", () => {
  jumpPressed = true;
});

document.getElementById("jumpBtn").addEventListener("touchend", () => {
  jumpPressed = false;
});

// UPDATE
function update() {

  const speed = 0.5;

  let left = keys["a"] || moveDir === -1;
  let right = keys["d"] || moveDir === 1;
  let jump = keys["w"] || jumpPressed;

  if (left) player.vx = -speed;
  else if (right) player.vx = speed;
  else player.vx = 0;

  if (jump && player.onGround) {
    player.vy = -6;
    player.onGround = false;
  }

  player.vy += 0.3;

  player.x += player.vx;
  player.y += player.vy * 0.1;

  // BORDERS
  player.x = Math.max(0, Math.min(cols - 1, player.x));
  player.y = Math.max(0, Math.min(rows - 2, player.y));

  let below = Math.floor(player.y + 1);
  let px = Math.floor(player.x);

  if (world[below] && world[below][px] !== "air") {
    player.y = Math.floor(player.y);
    player.vy = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }
}

// DRAW
function drawWorld() {
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      let block = world[y][x];

      if (block === "grass") ctx.fillStyle = "green";
      else if (block === "soil") ctx.fillStyle = "brown";
      else if (block === "bedrock") ctx.fillStyle = "#222";
      else continue;

      ctx.fillRect(x*tileSize, y*tileSize, tileSize, tileSize);
    }
  }
}

function drawPlayer() {
  let px = player.x * tileSize;
  let py = player.y * tileSize;

  ctx.fillStyle = "red";
  ctx.fillRect(px, py, tileSize, tileSize);

  ctx.fillStyle = "white";
  ctx.fillRect(px+6, py+8, 6, 6);
  ctx.fillRect(px+20, py+8, 6, 6);

  ctx.fillStyle = "black";
  ctx.fillText(playerName, px, py - 5);
}

// LOOP
function gameLoop() {
  update();

  ctx.clearRect(0,0,canvas.width,canvas.height);

  drawWorld();
  drawPlayer();

  requestAnimationFrame(gameLoop);
}
</script>

</body>
</html>

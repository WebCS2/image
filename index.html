<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<title>Auth App</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f0f0f0;
}

.dark {
  background: #121212;
  color: white;
}

.container {
  margin-top: 50px;
}

input {
  padding: 10px;
  margin: 5px;
  width: 200px;
}

button {
  padding: 10px;
  margin: 5px;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="auth" class="container">
  <h2>Registracija</h2>
  <input id="username" placeholder="Username"><br>
  <input id="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="Password"><br>
  <button onclick="register()">Registruotis</button>

  <h2>Prisijungimas</h2>
  <input id="loginEmail" placeholder="Email"><br>
  <input id="loginPassword" type="password" placeholder="Password"><br>
  <button onclick="login()">Prisijungti</button>

  <p id="msg"></p>
</div>

<div id="main" class="container" style="display:none;">
  <h1>Main Page</h1>
  <p>Email: <span id="userEmail"></span></p>
  <p>Username: <span id="userName"></span></p>

  <h3>Settings</h3>
  <button onclick="toggleTheme()">Dark / Light</button>
  <button onclick="logout()">Logout</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-analytics.js";
import { 
  getAuth, 
  createUserWithEmailAndPassword, 
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

import { 
  getFirestore, 
  doc, 
  setDoc, 
  getDoc 
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

// 🔥 TAVO CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCySjf5hLzR_23madNr6j8ItMFzJBndDBY",
  authDomain: "clat-2b072.firebaseapp.com",
  projectId: "clat-2b072",
  storageBucket: "clat-2b072.firebasestorage.app",
  messagingSenderId: "687262318153",
  appId: "1:687262318153:web:9a3c9c8aebaa424fb70998",
  measurementId: "G-65V5H3GJTY"
};

// INIT
const app = initializeApp(firebaseConfig);
getAnalytics(app);

const auth = getAuth(app);
const db = getFirestore(app);

// REGISTER
window.register = async () => {
  const username = usernameInput.value;
  const email = emailInput.value;
  const password = passwordInput.value;

  if (!username) {
    msg.innerText = "Įvesk username";
    return;
  }

  // tikrinam ar username užimtas
  const ref = doc(db, "usernames", username);
  const snap = await getDoc(ref);

  if (snap.exists()) {
    msg.innerText = "Username jau užimtas!";
    return;
  }

  try {
    const user = await createUserWithEmailAndPassword(auth, email, password);

    await setDoc(doc(db, "users", user.user.uid), {
      email,
      username
    });

    await setDoc(ref, {
      uid: user.user.uid
    });

  } catch (e) {
    msg.innerText = e.message;
  }
};

// LOGIN
window.login = async () => {
  try {
    await signInWithEmailAndPassword(auth, loginEmail.value, loginPassword.value);
  } catch (e) {
    msg.innerText = e.message;
  }
};

// AUTH STATE
onAuthStateChanged(auth, async (user) => {
  if (user) {
    authDiv.style.display = "none";
    mainDiv.style.display = "block";

    const snap = await getDoc(doc(db, "users", user.uid));
    const data = snap.data();

    userEmail.innerText = data.email;
    userName.innerText = data.username;

  } else {
    authDiv.style.display = "block";
    mainDiv.style.display = "none";
  }
});

// LOGOUT
window.logout = () => signOut(auth);

// THEME
window.toggleTheme = () => {
  document.body.classList.toggle("dark");
  localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
};

// LOAD THEME
if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
}

// DOM
const usernameInput = document.getElementById("username");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

const loginEmail = document.getElementById("loginEmail");
const loginPassword = document.getElementById("loginPassword");

const msg = document.getElementById("msg");

const authDiv = document.getElementById("auth");
const mainDiv = document.getElementById("main");

const userEmail = document.getElementById("userEmail");
const userName = document.getElementById("userName");

</script>

</body>
</html>

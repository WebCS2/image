<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg, #1e3c72, #2a5298);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.box {
  background: rgba(0,0,0,0.6);
  padding: 30px;
  border-radius: 15px;
  text-align: center;
}

input {
  display: block;
  margin: 10px auto;
  padding: 10px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  background: #00c6ff;
  color: white;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="box">
  <h2>Login / Register</h2>
  <input type="text" id="username" placeholder="Name">
  <input type="password" id="password" placeholder="Password">
  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
</div>

<script>
function setCookie(name, value) {
  document.cookie = name + "=" + value + "; path=/";
}

function getCookie(name) {
  let cookies = document.cookie.split("; ");
  for (let c of cookies) {
    let [key, val] = c.split("=");
    if (key === name) return val;
  }
  return null;
}

function register() {
  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;

  if (!user || !pass) {
    alert("Fill all fields");
    return;
  }

  setCookie("user", user);
  setCookie("pass", pass);
  alert("Registered!");
}

function login() {
  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;

  if (getCookie("user") === user && getCookie("pass") === pass) {
    window.location.href = "/coinflip";
  } else {
    alert("Wrong login");
  }
}
</script>

</body>
</html>

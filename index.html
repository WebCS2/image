<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    query,
    where,
    getDocs
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyCySjf5hLzR_23madNr6j8ItMFzJBndDBY",
    authDomain: "clat-2b072.firebaseapp.com",
    projectId: "clat-2b072",
    storageBucket: "clat-2b072.firebasestorage.app",
    messagingSenderId: "687262318153",
    appId: "1:687262318153:web:9a3c9c8aebaa424fb70998"
  };

  // Init Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // 🔐 REGISTER
  window.register = async function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    await createUserWithEmailAndPassword(auth, email, password);
  };

  // 🔑 LOGIN
  window.login = async function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    await signInWithEmailAndPassword(auth, email, password);
  };

  // 🚪 LOGOUT
  window.logout = async function () {
    await signOut(auth);
  };

  // 👤 AUTH STATE
  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById("dashboard").style.display = "block";
    } else {
      document.getElementById("dashboard").style.display = "none";
    }
  });

  // 📊 ADD GRADE
  window.addGrade = async function () {
    const user = auth.currentUser;
    if (!user) return;

    const subject = document.getElementById("gradeSubject").value;
    const value = document.getElementById("gradeValue").value;

    await addDoc(collection(db, "grades"), {
      uid: user.uid,
      subject,
      value
    });

    loadGrades();
  };

  // 📥 LOAD GRADES
  async function loadGrades() {
    const user = auth.currentUser;
    if (!user) return;

    const q = query(collection(db, "grades"), where("uid", "==", user.uid));
    const snap = await getDocs(q);

    const gradesDiv = document.getElementById("grades");
    gradesDiv.innerHTML = "";

    snap.forEach(doc => {
      const d = doc.data();
      gradesDiv.innerHTML += `<p>${d.subject}: ${d.value}</p>`;
    });
  }

</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auth UI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1020;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }

    .box {
      background: #1b1d36;
      padding: 25px;
      border-radius: 12px;
      width: 320px;
    }

    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-radius: 10px;
      overflow: hidden;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      background: #0f1020;
    }

    .tab.active {
      background: #3b3f7a;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: none;
      outline: none;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #3b3f7a;
      color: white;
    }

    #dashboard {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      background: #0f1020;
    }

    .topbar {
      position: absolute;
      top: 15px;
      left: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background: gray;
    }

    .logout {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 8px 12px;
      background: #3b3f7a;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
    }

    .upload {
      font-size: 12px;
    }
  </style>
</head>
<body>

<div class="box" id="auth">
  <div class="tabs">
    <div class="tab active" id="signupTab" onclick="setMode(true)">Sign up</div>
    <div class="tab" id="loginTab" onclick="setMode(false)">Sign in</div>
  </div>

  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">

  <input type="file" id="avatar" class="upload" accept="image/*">

  <button onclick="submitForm()" id="actionBtn">Sign up</button>
</div>

<div id="dashboard">
  <div class="topbar">
    <img id="avatarImg" class="avatar">
    <span id="displayName"></span>
  </div>

  <button class="logout" onclick="logout()">Log out</button>
</div>

<script>
  let isSignup = true;

  function setMode(signup) {
    isSignup = signup;

    document.getElementById('signupTab').classList.toggle('active', signup);
    document.getElementById('loginTab').classList.toggle('active', !signup);

    document.getElementById('actionBtn').innerText = signup ? 'Sign up' : 'Sign in';
  }

  function getUsers() {
    return JSON.parse(localStorage.getItem('users') || '[]');
  }

  function saveUsers(users) {
    localStorage.setItem('users', JSON.stringify(users));
  }

  function submitForm() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const file = document.getElementById('avatar').files[0];

    if (!username || !password) {
      alert('Fill all fields');
      return;
    }

    const users = getUsers();

    if (isSignup) {
      const exists = users.find(u => u.username.toLowerCase() === username.toLowerCase());
      if (exists) {
        alert('Username already taken');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const avatar = e.target.result;

        users.push({ username, password, avatar });
        saveUsers(users);
        localStorage.setItem('currentUser', JSON.stringify({ username, avatar }));

        showDashboard(username, avatar);
      };

      if (file) reader.readAsDataURL(file);
      else reader.onload({ target: { result: '' } });

    } else {
      const user = users.find(u => u.username === username && u.password === password);

      if (!user) {
        alert('Invalid login');
        return;
      }

      localStorage.setItem('currentUser', JSON.stringify({ username: user.username, avatar: user.avatar }));
      showDashboard(user.username, user.avatar);
    }
  }

  function showDashboard(name, avatar) {
    document.getElementById('auth').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';

    document.getElementById('displayName').innerText = name;
    document.getElementById('avatarImg').src = avatar || 'https://via.placeholder.com/40';
  }

  function logout() {
    localStorage.removeItem('currentUser');
    document.getElementById('auth').style.display = 'block';
    document.getElementById('dashboard').style.display = 'none';
  }

  window.onload = function() {
    const current = JSON.parse(localStorage.getItem('currentUser'));
    if (current) {
      showDashboard(current.username, current.avatar);
    }
  }
</script>

</body>
</html>

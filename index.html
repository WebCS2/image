<!DOCTYPE html>
<html>
<head>
<title>Mini Growtopia Login</title>
<style>
    body {
        background:#1e1e1e;
        font-family:Arial;
        color:white;
        text-align:center;
    }
    .frame {
        width:300px;
        margin:80px auto;
        padding:20px;
        background:#2b2b2b;
        border-radius:10px;
        display:none;
    }
    input {
        width:90%;
        padding:10px;
        margin:8px 0;
        border:none;
        border-radius:5px;
    }
    button {
        width:95%;
        padding:10px;
        margin-top:10px;
        background:#4caf50;
        border:none;
        border-radius:5px;
        color:white;
        font-size:16px;
        cursor:pointer;
    }
    button:hover { background:#45a049; }
</style>
</head>
<body>

<h1>Mini Growtopia</h1>

<!-- MAIN MENU -->
<div id="menu" class="frame" style="display:block;">
    <button onclick="showFrame('signup')">Sign Up</button>
    <button onclick="showFrame('login')">Log In</button>
</div>

<!-- SIGN UP FRAME -->
<div id="signup" class="frame">
    <h2>Create Account</h2>
    <input id="su_name" placeholder="Username">
    <input id="su_pass" type="password" placeholder="Password">
    <button onclick="signUp()">Create</button>
    <button onclick="showFrame('menu')">Back</button>
</div>

<!-- LOGIN FRAME -->
<div id="login" class="frame">
    <h2>Log In</h2>
    <input id="li_name" placeholder="Username">
    <input id="li_pass" type="password" placeholder="Password">
    <button onclick="logIn()">Enter</button>
    <button onclick="showFrame('menu')">Back</button>
</div>

<!-- GAME FRAME -->
<div id="game" class="frame">
    <h2>Welcome, <span id="playerName"></span>!</h2>
    <p>Game world loading...</p>
</div>

<script>
    // Reserved creator names
    const blockedNames = ["Emilis", "Krooks", "Admin", "Owner"];

    // Load saved accounts
    let accounts = JSON.parse(localStorage.getItem("accounts") || "{}");

    function showFrame(id) {
        document.querySelectorAll(".frame").forEach(f => f.style.display = "none");
        document.getElementById(id).style.display = "block";
    }

    function signUp() {
        let name = su_name.value.trim();
        let pass = su_pass.value;

        if (!name || !pass) return alert("Fill everything");

        if (blockedNames.includes(name)) {
            return alert("This name is reserved by creators. Choose another.");
        }

        if (accounts[name]) {
            return alert("Name already taken");
        }

        accounts[name] = pass;
        localStorage.setItem("accounts", JSON.stringify(accounts));

        alert("Account created!");
        showFrame("login");
    }

    function logIn() {
        let name = li_name.value.trim();
        let pass = li_pass.value;

        if (accounts[name] && accounts[name] === pass) {
            document.getElementById("playerName").innerText = name;
            showFrame("game");
        } else {
            alert("Wrong username or password");
        }
    }
</script>

</body>
</html>

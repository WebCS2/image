<!DOCTYPE html>
<html>
<head>
  <title>Pixelia Worlds</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: #1e1e1e;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
      text-align: center;
    }

    h1 { margin-top: 30px; }

    .frame {
      width: 300px;
      margin: 80px auto;
      padding: 20px;
      background: #2b2b2b;
      border-radius: 10px;
      display: none;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 5px;
    }

    button {
      width: 95%;
      padding: 10px;
      margin-top: 10px;
      background: #4caf50;
      border: none;
      border-radius: 5px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #world {
      width: 100vw;
      height: 100vh;
      background: #3a3a3a;
      position: relative;
      display: none;
      overflow: hidden;
    }

    .player {
      width: 30px;
      height: 40px;
      background: #00aaff;
      position: absolute;
      border-radius: 5px;
    }

    #chatBox {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 95%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 9999;
    }

    #chatMessages {
      width: 100%;
      height: 180px;
      background: rgba(0,0,0,0.8);
      overflow-y: auto;
      padding: 10px;
      border-radius: 10px;
      font-size: 16px;
      color: white;
      backdrop-filter: blur(6px);
    }

    #chatInput {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    #statusBar {
      position: fixed;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 9999;
    }

    #logoutBtn {
      position: fixed;
      top: 10px;
      right: 10px;
      background: #d9534f;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      z-index: 9999;
    }
  </style>
</head>
<body>

<h1 id="title">Pixelia Worlds</h1>

<div id="menu" class="frame" style="display:block;">
  <button onclick="showFrame('signup')">Sign Up</button>
  <button onclick="showFrame('login')">Log In</button>
</div>

<div id="signup" class="frame">
  <h2>Create Account</h2>
  <input id="su_username" placeholder="Username">
  <input id="su_pass" type="password" placeholder="Password">
  <button onclick="signUp()">Create & Join</button>
  <button onclick="showFrame('menu')">Back</button>
</div>

<div id="login" class="frame">
  <h2>Log In</h2>
  <input id="li_username" placeholder="Username">
  <input id="li_pass" type="password" placeholder="Password">
  <button onclick="logIn()">Enter</button>
  <button onclick="showFrame('menu')">Back</button>
</div>

<div id="world">
  <div id="logoutBtn" onclick="logout()">Logout</div>
  <div id="statusBar">Players online: <span id="playerCount">0</span>/10</div>

  <div id="chatBox">
    <div id="chatMessages"></div>
    <input id="chatInput" placeholder="Type message and press Enter">
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCx4dKsPQ5ph7g7P6E7ZAv7NarT0uQhZGQ",
    authDomain: "pixeliaworlds.firebaseapp.com",
    projectId: "pixeliaworlds",
    storageBucket: "pixeliaworlds.appspot.com",
    messagingSenderId: "261360406874",
    appId: "1:261360406874:web:c516b77a56eb529cfea363",
    measurementId: "G-DRNSDL3LRD"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let currentUser = null;
  let players = {};
  let keys = {};

  const worldEl = document.getElementById("world");
  const chatInput = document.getElementById("chatInput");
  const chatMessages = document.getElementById("chatMessages");
  const playerCountSpan = document.getElementById("playerCount");

  function showFrame(id) {
    document.querySelectorAll(".frame").forEach(f => f.style.display = "none");
    document.getElementById(id).style.display = "block";
  }

  async function hashPassword(password) {
    const msgUint8 = new TextEncoder().encode(password);
    const hashBuffer = await crypto.subtle.digest("SHA-256", msgUint8);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
  }

  async function signUp() {
    const username = su_username.value.trim();
    const pass = su_pass.value;

    if (!username || !pass) return alert("Fill everything");

    const accRef = db.ref("accounts/" + username);
    const snap = await accRef.once("value");

    if (snap.exists()) return alert("Username already taken");

    const hash = await hashPassword(pass);

    await accRef.set({
      username,
      passwordHash: hash
    });

    currentUser = username;
    startGame();
  }

  async function logIn() {
    const username = li_username.value.trim();
    const pass = li_pass.value;

    if (!username || !pass) return alert("Fill everything");

    const accRef = db.ref("accounts/" + username);
    const snap = await accRef.once("value");

    if (!snap.exists()) return alert("User not found");

    const data = snap.val();
    const hash = await hashPassword(pass);

    if (hash !== data.passwordHash) return alert("Wrong password");

    currentUser = username;
    startGame();
  }

  function logout() {
    if (currentUser) {
      db.ref("players/" + currentUser).remove();
    }
    currentUser = null;
    worldEl.style.display = "none";
    document.getElementById("title").style.display = "block";
    showFrame("menu");
  }

  async function startGame() {
    document.getElementById("title").style.display = "none";
    document.querySelectorAll(".frame").forEach(f => f.style.display = "none");
    worldEl.style.display = "block";

    const playersRef = db.ref("players");
    const snap = await playersRef.once("value");

    if (snap.numChildren() >= 10) {
      alert("Server full (10/10). Try later.");
      logout();
      return;
    }

    const playerRef = db.ref("players/" + currentUser);
    playerRef.set({ username: currentUser, x: 200, y: 200 });
    playerRef.onDisconnect().remove();

    db.ref("players").on("value", snap => {
      const data = snap.val() || {};
      playerCountSpan.textContent = Object.keys(data).length;

      for (let id in players) {
        if (!data[id]) {
          players[id].element.remove();
          delete players[id];
        }
      }

      for (let id in data) {
        const p = data[id];
        if (!players[id]) {
          players[id] = {
            x: p.x, y: p.y, username: p.username,
            element: createPlayerElement(p.username)
          };
        }
        players[id].x = p.x;
        players[id].y = p.y;
        updatePlayerPosition(players[id]);
      }
    });

    db.ref("chat").limitToLast(50).on("child_added", snap => {
      const msg = snap.val();
      addChatMessage(msg.username + ": " + msg.text);
    });

    gameLoop();
  }

  function createPlayerElement(username) {
    const div = document.createElement("div");
    div.className = "player";
    div.innerHTML = `<span style="position:absolute;top:-18px;font-size:12px;">${username}</span>`;
    worldEl.appendChild(div);
    return div;
  }

  function updatePlayerPosition(p) {
    p.element.style.left = p.x + "px";
    p.element.style.top = p.y + "px";
  }

  document.addEventListener("keydown", e => keys[e.key] = true);
  document.addEventListener("keyup", e => keys[e.key] = false);

  function gameLoop() {
    if (currentUser && players[currentUser]) {
      const me = players[currentUser];
      let moved = false;

      if (keys["a"] || keys["ArrowLeft"]) { me.x -= 3; moved = true; }
      if (keys["d"] || keys["ArrowRight"]) { me.x += 3; moved = true; }
      if (me.y < 400) { me.y += 3; moved = true; }

      updatePlayerPosition(me);

      if (moved) {
        db.ref("players/" + currentUser).update({ x: me.x, y: me.y });
      }
    }
    requestAnimationFrame(gameLoop);
  }

  chatInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && currentUser) {
      const text = chatInput.value.trim();
      if (!text) return;

      db.ref("chat").push({
        username: currentUser,
        text,
        ts: firebase.database.ServerValue.TIMESTAMP
      });

      chatInput.value = "";
    }
  });

  function addChatMessage(text) {
    const div = document.createElement("div");
    div.textContent = text;
    chatMessages.appendChild(div);
    chatMessages

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auth UI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1020;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }

    .box {
      background: #1b1d36;
      padding: 25px;
      border-radius: 12px;
      width: 320px;
    }

    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-radius: 10px;
      overflow: hidden;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      background: #0f1020;
    }

    .tab.active {
      background: #3b3f7a;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: none;
      outline: none;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #3b3f7a;
      color: white;
    }

    #dashboard {
      position: absolute;
      top: 20px;
      right: 20px;
      display: none;
    }
  </style>
</head>
<body>

<div class="box" id="auth">
  <div class="tabs">
    <div class="tab active" id="signupTab" onclick="setMode(true)">Sign up</div>
    <div class="tab" id="loginTab" onclick="setMode(false)">Sign in</div>
  </div>

  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">

  <button onclick="submitForm()" id="actionBtn">Sign up</button>
</div>

<div id="dashboard">
  <button onclick="logout()">Log out</button>
</div>

<script>
  let isSignup = true;

  function setMode(signup) {
    isSignup = signup;

    document.getElementById('signupTab').classList.toggle('active', signup);
    document.getElementById('loginTab').classList.toggle('active', !signup);

    document.getElementById('actionBtn').innerText = signup ? 'Sign up' : 'Sign in';
  }

  function getUsers() {
    return JSON.parse(localStorage.getItem('users') || '[]');
  }

  function saveUsers(users) {
    localStorage.setItem('users', JSON.stringify(users));
  }

  function submitForm() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      alert('Fill all fields');
      return;
    }

    const users = getUsers();

    if (isSignup) {
      const exists = users.find(u => u.username.toLowerCase() === username.toLowerCase());

      if (exists) {
        alert('Username already taken');
        return;
      }

      users.push({ username, password });
      saveUsers(users);

      alert('Account created! Now sign in.');
      setMode(false);

    } else {
      const user = users.find(u => u.username === username && u.password === password);

      if (!user) {
        alert('Invalid login');
        return;
      }

      showDashboard(username);
    }
  }

  function showDashboard(name) {
    document.getElementById('auth').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
  }

  function logout() {
    document.getElementById('auth').style.display = 'block';
    document.getElementById('dashboard').style.display = 'none';
  }
</script>

</body>
</html>

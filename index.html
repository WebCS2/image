<!DOCTYPE html>
<html>
<head>
<title>Mini 2D Game</title>
<style>
    body {
        background:#1e1e1e;
        font-family:Arial;
        color:white;
        text-align:center;
        overflow:hidden;
        margin:0;
    }
    .frame {
        width:300px;
        margin:80px auto;
        padding:20px;
        background:#2b2b2b;
        border-radius:10px;
        display:none;
    }
    input {
        width:90%;
        padding:10px;
        margin:8px 0;
        border:none;
        border-radius:5px;
    }
    button {
        width:95%;
        padding:10px;
        margin-top:10px;
        background:#4caf50;
        border:none;
        border-radius:5px;
        color:white;
        font-size:16px;
        cursor:pointer;
    }
    #world {
        width:100vw;
        height:100vh;
        background:#3a3a3a;
        position:relative;
        display:none;
        overflow:hidden;
    }
    .player {
        width:30px;
        height:40px;
        background:#00aaff;
        position:absolute;
        border-radius:5px;
    }
    #chatBox {
        position:absolute;
        bottom:10px;
        left:50%;
        transform:translateX(-50%);
        width:300px;
    }
    #chatMessages {
        width:300px;
        height:120px;
        background:#00000080;
        overflow-y:auto;
        padding:5px;
        border-radius:5px;
        text-align:left;
        font-size:14px;
    }
</style>
</head>
<body>

<h1 id="title">Mini 2D Game</h1>

<!-- MENU -->
<div id="menu" class="frame" style="display:block;">
    <button onclick="showFrame('signup')">Sign Up</button>
    <button onclick="showFrame('login')">Log In</button>
</div>

<!-- SIGN UP -->
<div id="signup" class="frame">
    <h2>Create Account</h2>
    <input id="su_name" placeholder="Username">
    <input id="su_pass" type="password" placeholder="Password">
    <button onclick="signUp()">Create</button>
    <button onclick="showFrame('menu')">Back</button>
</div>

<!-- LOGIN -->
<div id="login" class="frame">
    <h2>Log In</h2>
    <input id="li_name" placeholder="Username">
    <input id="li_pass" type="password" placeholder="Password">
    <button onclick="logIn()">Enter</button>
    <button onclick="showFrame('menu')">Back</button>
</div>

<!-- WORLD -->
<div id="world">
    <div id="chatBox">
        <div id="chatMessages"></div>
        <input id="chatInput" placeholder="Press Enter to chat">
    </div>
</div>

<script>
/* -------------------------
   ACCOUNT SYSTEM
--------------------------*/

let accounts = JSON.parse(localStorage.getItem("accounts") || "{}");
let players = {};
let currentPlayer = null;

function showFrame(id) {
    document.querySelectorAll(".frame").forEach(f => f.style.display = "none");
    document.getElementById(id).style.display = "block";
}

function signUp() {
    let name = su_name.value.trim();
    let pass = su_pass.value;

    if (!name || !pass) return alert("Fill everything");

    if (accounts[name]) return alert("Name already taken");

    accounts[name] = pass;
    localStorage.setItem("accounts", JSON.stringify(accounts));

    alert("Account created!");
    showFrame("login");
}

function logIn() {
    let name = li_name.value.trim();
    let pass = li_pass.value;

    if (accounts[name] && accounts[name] === pass) {
        startGame(name);
    } else {
        alert("Wrong username or password");
    }
}

/* -------------------------
   GAME WORLD
--------------------------*/
function startGame(name) {
    document.getElementById("title").style.display = "none";
    document.querySelectorAll(".frame").forEach(f => f.style.display = "none");
    document.getElementById("world").style.display = "block";

    currentPlayer = {
        name: name,
        x: 200,
        y: 200,
        element: createPlayerElement(name)
    };

    players[name] = currentPlayer;
    updatePlayerPosition(currentPlayer);
}

function createPlayerElement(name) {
    let div = document.createElement("div");
    div.className = "player";
    div.innerHTML = `<span style='position:absolute;top:-18px;font-size:12px;'>${name}</span>`;
    document.getElementById("world").appendChild(div);
    return div;
}

function updatePlayerPosition(p) {
    p.element.style.left = p.x + "px";
    p.element.style.top = p.y + "px";
}

/* -------------------------
   MOVEMENT
--------------------------*/
let keys = {};

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

function gameLoop() {
    if (currentPlayer) {
        if (keys["a"] || keys["ArrowLeft"]) currentPlayer.x -= 3;
        if (keys["d"] || keys["ArrowRight"]) currentPlayer.x += 3;

        if (currentPlayer.y < 400) currentPlayer.y += 3;

        updatePlayerPosition(currentPlayer);
    }
    requestAnimationFrame(gameLoop);
}
gameLoop();

/* -------------------------
   CHAT SYSTEM
--------------------------*/
document.getElementById("chatInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        let msg = this.value.trim();
        if (msg.length > 0) {
            addChatMessage(currentPlayer.name + ": " + msg);
        }
        this.value = "";
    }
});

function addChatMessage(text) {
    let box = document.getElementById("chatMessages");
    let div = document.createElement("div");
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}
</script>

</body>
</html>

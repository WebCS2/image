<!DOCTYPE html>
<html>
<head>
<title>2D Game – PC + Mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #87CEEB;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
}

/* NAME SCREEN */
#nameBox {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

/* CHAT */
#chatContainer {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 260px;
  background: rgba(0,0,0,0.6);
  border-radius: 10px;
  padding: 10px;
  color: white;
  display: none;
}

#chatLog {
  height: 140px;
  overflow-y: auto;
  font-size: 14px;
}

#chatInput {
  width: 100%;
  padding: 6px;
  margin-top: 5px;
  box-sizing: border-box;
}

/* MOBILE CONTROLS */
#controls {
  position: absolute;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* JOYSTICK */
#joystick {
  position: absolute;
  bottom: 30px;
  left: 30px;
  width: 110px;
  height: 110px;
  background: rgba(0,0,0,0.2);
  border-radius: 50%;
  pointer-events: auto;
  touch-action: none;
}

#stick {
  width: 50px;
  height: 50px;
  background: rgba(0,0,0,0.5);
  border-radius: 50%;
  position: absolute;
  top: 30px;
  left: 30px;
  transition: transform 0.05s linear;
}

/* JUMP BUTTON */
#jumpBtn {
  position: absolute;
  bottom: 40px;
  right: 40px;
  width: 80px;
  height: 80px;
  background: rgba(0,0,0,0.4);
  border-radius: 50%;
  color: white;
  font-size: 18px;
  display: flex;
  justify-content: center;
  align-items: center;
  pointer-events: auto;
  touch-action: none;
  user-select: none;
}
</style>
</head>
<body>

<div id="nameBox">
  <h2>Enter name</h2>
  <input id="nameInput" maxlength="16">
  <button onclick="startGame()">Start</button>
</div>

<div id="chatContainer">
  <div id="chatLog"></div>
  <input id="chatInput" placeholder="Enter = chat / commands">
</div>

<div id="controls">
  <div id="joystick"><div id="stick"></div></div>
  <div id="jumpBtn">JUMP</div>
</div>

<canvas id="game"></canvas>

<script>
/* ============================================================
   CANVAS + RESIZE
============================================================ */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();

window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", () => {
  setTimeout(resizeCanvas, 300);
});

/* ============================================================
   MOBILE DETECTION
============================================================ */
const isMobile = /Android|iPhone|iPad|iPod|Tablet/i.test(navigator.userAgent);

if (!isMobile) {
  document.getElementById("controls").style.display = "none";
}

/* ============================================================
   WORLD SETTINGS
============================================================ */
const tileSize = 32;
const worldWidth = 200;
const worldHeight = 60;

let world = [];

/* ============================================================
   PLAYER
============================================================ */
let keys = {};
let chatOpen = false;
let playerName = "";
let isAdmin = false;

let player = {
  x: 10,
  y: 10,
  vx: 0,
  vy: 0,
  onGround: false,
  visible: true
};

/* CAMERA */
let camX = 0;
let camY = 0;

/* PARTICLES */
let particles = [];

/* ============================================================
   WORLD GENERATION
============================================================ */
function generateWorld() {
  for (let y = 0; y < worldHeight; y++) {
    world[y] = [];
    for (let x = 0; x < worldWidth; x++) {
      if (y === 20) world[y][x] = "grass";
      else if (y > 20 && y < 30) world[y][x] = "soil";
      else if (y >= 30) world[y][x] = "bedrock";
      else world[y][x] = "air";
    }
  }
}

/* ============================================================
   START GAME
============================================================ */
function startGame() {
  playerName = document.getElementById("nameInput").value.trim();
  if (!playerName) return;

  if (playerName === "Xolo") isAdmin = true;

  document.getElementById("nameBox").style.display = "none";
  document.getElementById("chatContainer").style.display = "block";

  generateWorld();
  respawnPlayer();

  gameLoop();
}

/* ============================================================
   CHAT
============================================================ */
const chatInput = document.getElementById("chatInput");
const chatLog = document.getElementById("chatLog");

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && !chatOpen) {
    chatOpen = true;
    chatInput.focus();
    return;
  }
  if (!chatOpen) keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e => {
  if (!chatOpen) keys[e.key.toLowerCase()] = false;
});

chatInput.addEventListener("keydown", e => {
  e.stopPropagation();

  if (e.key === "Enter") {
    const msg = chatInput.value.trim();

    if (msg) {
      if (isAdmin && msg.startsWith("/")) {
        handleAdminCommand(msg);
      } else {
        const nameTag = isAdmin
          ? '<span style="color:purple">@Xolo</span>'
          : `<span>${playerName}</span>`;

        chatLog.innerHTML += `<div><b>${nameTag}:</b> ${escapeHtml(msg)}</div>`;
      }
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    chatInput.value = "";
    chatOpen = false;
    keys = {};
    chatInput.blur();
  }
});

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* ============================================================
   ADMIN COMMANDS
============================================================ */
function handleAdminCommand(cmd) {
  if (cmd === "/respawn") {
    respawnPlayer();
    chatLog.innerHTML += `<div style="color:#9cf;"><b>@Xolo:</b> respawned</div>`;
  }

  if (cmd === "/invisible") {
    player.visible = !player.visible;

    if (player.visible) {
      flashEffect();
      chatLog.innerHTML += `<div style="color:#9cf;"><b>@Xolo:</b> visible</div>`;
    } else {
      invisibleEffect();
      chatLog.innerHTML += `<div style="color:#9cf;"><b>@Xolo:</b> invisible</div>`;
    }
  }

  chatLog.scrollTop = chatLog.scrollHeight;
}

/* ============================================================
   EFFECTS
============================================================ */
function invisibleEffect() {
  for (let i = 0; i < 40; i++) {
    particles.push({
      x: player.x * tileSize + tileSize / 2,
      y: player.y * tileSize + tileSize / 2,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      life: 20,
      color: "rgba(200,0,255,0.7)"
    });
  }
}

function flashEffect() {
  for (let i = 0; i < 40; i++) {
    particles.push({
      x: player.x * tileSize + tileSize / 2,
      y: player.y * tileSize + tileSize / 2,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      life: 20,
      color: "rgba(255,255,0,0.9)"
    });
  }
}

/* ============================================================
   RESPAWN
============================================================ */
function respawnPlayer() {
  player.x = 10;
  player.y = 10;
  player.vx = 0;
  player.vy = 0;
}

/* ============================================================
   MOBILE JOYSTICK
============================================================ */
let moveDir = 0;
let jumpPressed = false;

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

if (isMobile) {
  joystick.addEventListener("touchmove", e => {
    e.preventDefault();
    let rect = joystick.getBoundingClientRect();
    let touch = e.touches[0];
    let dx = touch.clientX - (rect.left + rect.width / 2);

    if (dx < -15) moveDir = -1;
    else if (dx > 15) moveDir = 1;
    else moveDir = 0;

    stick.style.transform = `translate(${dx / 3}px, 0px)`;
  });

  joystick.addEventListener("touchend", () => {
    moveDir = 0;
    stick.style.transform = "translate(0px,0px)";
  });
}

/* JUMP BUTTON */
const jumpBtn = document.getElementById("jumpBtn");

jumpBtn.addEventListener("touchstart", () => jumpPressed = true);
jumpBtn.addEventListener("touchend", () => jumpPressed = false);

jumpBtn.addEventListener("mousedown", () => jumpPressed = true);
jumpBtn.addEventListener("mouseup", () => jumpPressed = false);

/* ============================================================
   UPDATE LOOP
============================================================ */
function update() {
  const speed = 0.5;

  let left = keys["a"] || moveDir === -1;
  let right = keys["d"] || moveDir === 1;
  let jump = keys["w"] || keys[" "] || jumpPressed;

  if (left) player.vx = -speed;
  else if (right) player.vx = speed;
  else player.vx = 0;

  if (jump && player.onGround) {
    player.vy = -7;
    player.onGround = false;
  }

  player.vy += 0.3;

  player.x += player.vx;
  player.y += player.vy * 0.1;

  if (player.y > worldHeight + 5) respawnPlayer();

  let px = Math.floor(player.x);
  let py = Math.floor(player.y + 1);

  if (world[py] && world[py][px] !== "air") {
    player.y = Math.floor(player.y);
    player.vy = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }

  updateParticles();

  camX = player.x * tileSize - canvas.width / 2;
  camY = player.y * tileSize - canvas.height / 2;

  camX = Math.max(0, Math.min(camX, worldWidth * tileSize - canvas.width));
  camY = Math.max(0, Math.min(camY, worldHeight * tileSize - canvas.height));
}

/* ============================================================
   PARTICLES
============================================================ */
function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - camX, p.y - camY, 4, 4);
  });
}

/* ============================================================
   DRAW WORLD + PLAYER
============================================================ */
function drawWorld() {
  for (let y = 0; y < worldHeight; y++) {
    for (let x = 0; x < worldWidth; x++) {
      let block = world[y][x];
      if (block === "air") continue;

      if (block === "grass") ctx.fillStyle = "#3cb043";
      if (block === "soil") ctx.fillStyle = "#8b4513";
      if (block === "bedrock") ctx.fillStyle = "#222";

      ctx.fillRect(
        x * tileSize - camX,
        y * tileSize - camY,
        tileSize,
        tileSize
      );
    }
  }
}

function drawPlayer() {
  if (!player.visible) return;

  let px = player.x * tileSize - camX;
  let py = player.y * tileSize - camY;

  ctx.fillStyle = "red";
  ctx.fillRect(px, py, tileSize, tileSize);

  ctx.fillStyle = "white";
  ctx.fillRect(px + 6, py + 8, 6, 6);
  ctx.fillRect(px + 20, py + 8, 6, 6);

  ctx.font = "14px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "bottom";

  if (isAdmin) {
    ctx.fillStyle = "purple";
    ctx.fillText("@Xolo", px + tileSize / 2, py - 4);
  } else {
    ctx.fillStyle = "black";
    ctx.fillText(playerName, px + tileSize / 2, py - 4);
  }
}

/* ============================================================
   GAME LOOP
============================================================ */
function gameLoop() {
  update();

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawWorld();
  drawParticles();
  drawPlayer();

  requestAnimationFrame(gameLoop);
}
</script>

</body>
</html>

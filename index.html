<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auth UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1020;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      padding: 0 10px;
    }

    .box {
      background: #1b1d36;
      padding: 30px;
      border-radius: 14px;
      width: 340px;
      max-width: 100%;
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
      border-radius: 10px;
      overflow: hidden;
    }

    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      background: #0f1020;
      font-size: 16px;
    }

    .tab.active {
      background: #3b3f7a;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #3b3f7a;
      color: white;
      font-size: 16px;
    }

    #dashboard {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      background: #0f1020;
    }

    .topbar {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    .logout {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 6px 12px;
      background: #3b3f7a;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 14px;
      width: auto;
    }

    .coinFrame {
      position: absolute;
      top: 80px;
      left: 20px;
      width: 200px;
      background: #1b1d36;
      padding: 15px;
      border-radius: 10px;
    }

    .coinGame {
      display: none;
      position: absolute;
      top: 80px;
      left: 240px;
      width: 260px;
      background: #1b1d36;
      padding: 20px;
      border-radius: 10px;
    }

    @media (max-width: 480px) {
      .box {
        width: 95%;
        padding: 35px;
      }

      .tab {
        font-size: 18px;
        padding: 14px;
      }

      input {
        font-size: 18px;
        padding: 16px;
      }

      button {
        font-size: 18px;
        padding: 16px;
      }

      .topbar {
        font-size: 24px;
      }

      .logout {
        font-size: 14px;
        padding: 7px 14px;
      }

      .coinFrame {
        top: 80px;
        left: 10px;
        width: calc(100% - 20px);
      }

      .coinGame {
        top: 200px;
        left: 10px;
        width: calc(100% - 20px);
      }
    }

  </style>
</head>
<body>

<div class="box" id="auth">
  <div class="tabs">
    <div class="tab active" id="signupTab" onclick="setMode(true)">Sign up</div>
    <div class="tab" id="loginTab" onclick="setMode(false)">Sign in</div>
  </div>

  <input type="text" id="username" placeholder="Username" maxlength="10">
  <input type="password" id="password" placeholder="Password">

  <button onclick="submitForm()" id="actionBtn">Sign up</button>
</div>

<div id="dashboard">
  <div class="topbar">
    <span id="displayName"></span> — <span id="coinsDisplay"></span> Bytecoins
  </div>

  <button class="logout" onclick="logout()">Log out</button>

  <!-- LEFT FRAME: Coin Flip -->
  <div class="coinFrame">
    <h3>Coin Flip</h3>
    <p>Bet Bytecoins and try your luck.</p>
    <button onclick="openCoinFlip()">Play</button>
  </div>

  <!-- COIN FLIP GAME FRAME -->
  <div class="coinGame" id="coinGame">
    <h3>Coin Flip Game</h3>

    <label>Pick:</label><br>
    <button onclick="setPick('heads')">Heads</button>
    <button onclick="setPick('tails')">Tails</button>

    <p id="pickText">Pick: none</p>

    <input type="number" id="betAmount" placeholder="Bet amount">

    <button onclick="playCoinFlip()">Flip</button>

    <p id="resultText"></p>
  </div>

</div>

<script>
  let isSignup = true;
  let currentPick = null;

  function setMode(signup) {
    isSignup = signup;
    document.getElementById('signupTab').classList.toggle('active', signup);
    document.getElementById('loginTab').classList.toggle('active', !signup);
    document.getElementById('actionBtn').innerText = signup ? 'Sign up' : 'Sign in';
  }

  function getUsers() {
    return JSON.parse(localStorage.getItem('users') || '[]');
  }

  function saveUsers(users) {
    localStorage.setItem('users', JSON.stringify(users));
  }

  function submitForm() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      alert('Fill all fields');
      return;
    }

    if (username.length > 10) {
      alert("Username must be 10 characters or less");
      return;
    }

    let users = getUsers();

    if (isSignup) {
      // BLOCK DUPLICATE USERNAMES (CASE-INSENSITIVE)
      const exists = users.some(
        u => u.username.toLowerCase() === username.toLowerCase()
      );

      if (exists) {
        alert("Username already taken. Choose another one.");
        return;
      }

      // NEW USER WITH 10 BYTECOINS
      users.push({
        username: username,
        password: password,
        bytecoins: 10
      });

      saveUsers(users);
      localStorage.setItem('currentUser', username);
      showDashboard(username);
      return;
    }

    // SIGN IN
    const user = users.find(
      u => u.username === username && u.password === password
    );

    if (!user) {
      alert('Invalid login');
      return;
    }

    // If old user without bytecoins, give default 10
    if (typeof user.bytecoins !== 'number') {
      user.bytecoins = 10;
      saveUsers(users);
    }

    localStorage.setItem('currentUser', user.username);
    showDashboard(user.username);
  }

  function showDashboard(name) {
    document.getElementById('auth').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';

    const users = getUsers();
    const user = users.find(u => u.username === name);

    document.getElementById('displayName').innerText = name;
    document.getElementById('coinsDisplay').innerText = user.bytecoins ?? 0;
  }

  function logout() {
    localStorage.removeItem('currentUser');
    document.getElementById('auth').style.display = 'block';
    document.getElementById('dashboard').style.display = 'none';
  }

  window.onload = function() {
    const current = localStorage.getItem('currentUser');
    if (current) showDashboard(current);
  };

  // --------- COIN FLIP ---------

  function openCoinFlip() {
    document.getElementById('coinGame').style.display = 'block';
  }

  function setPick(p) {
    currentPick = p;
    document.getElementById('pickText').innerText = "Pick: " + p;
  }

  function playCoinFlip() {
    const bet = parseInt(document.getElementById('betAmount').value);

    if (!currentPick) {
      alert("Pick heads or tails");
      return;
    }
    if (!bet || bet <= 0) {
      alert("Enter a valid bet");
      return;
    }

    let users = getUsers();
    let currentName = localStorage.getItem('currentUser');
    let user = users.find(u => u.username === currentName);

    if (!user) {
      alert("User not found");
      return;
    }

    if (bet > user.bytecoins) {
      alert("Not enough Bytecoins");
      return;
    }

    // 10% TAX TO KROOKS (IF EXISTS)
    const tax = Math.floor(bet * 0.10);
    let krooks = users.find(u => u.username.toLowerCase() === "krooks");
    if (krooks) {
      krooks.bytecoins = (krooks.bytecoins ?? 0) + tax;
    }

    // REMOVE BET FROM USER
    user.bytecoins -= bet;

    // COIN FLIP
    const flip = Math.random() < 0.5 ? "heads" : "tails";

    if (flip === currentPick) {
      // USER WINS: GETS 2x BET
      const winnings = bet * 2;
      user.bytecoins += winnings;
      document.getElementById('resultText').innerText =
        "You WON! Coin landed on " + flip +
        ". You earned " + winnings + " Bytecoins. (10% of your bet went to Krooks)";
    } else {
      document.getElementById('resultText').innerText =
        "You lost! Coin landed on " + flip +
        ". (10% of your bet went to Krooks if Krooks exists)";
    }

    saveUsers(users);
    document.getElementById('coinsDisplay').innerText = user.bytecoins;
  }

</script>

</body>
</html>

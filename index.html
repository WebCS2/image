<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Auth</title>
  <style>
    body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .box { border: 1px solid #ccc; padding: 20px; border-radius: 10px; width: 300px; }
    input { display: block; margin: 10px 0; width: 100%; padding: 8px; }
    button { padding: 10px; width: 100%; margin-top: 10px; }
    #dashboard { position: absolute; top: 20px; right: 20px; display: none; }
  </style>
</head>
<body>

<div id="auth" class="box">
  <h2 id="title">Login</h2>
  <input type="text" id="name" placeholder="Name">
  <input type="password" id="password" placeholder="Password">
  <input type="date" id="birth" style="display:none">
  <button id="submitBtn" onclick="submitForm()">Log in</button>
  <button id="switchBtn" onclick="toggleMode()">Sign Up</button>
</div>

<div id="dashboard">
  <button onclick="logout()">Log out</button>
</div>

<script>
  let isSignup = false;

  function toggleMode() {
    isSignup = !isSignup;
    document.getElementById('title').innerText = isSignup ? 'Sign Up' : 'Login';

    // name is always required for both login and signup
    document.getElementById('name').style.display = 'block';

    // birth only for signup
    document.getElementById('birth').style.display = isSignup ? 'block' : 'none';

    document.getElementById('submitBtn').innerText = isSignup ? 'Sign Up' : 'Log in';
    document.getElementById('switchBtn').innerText = isSignup ? 'Back to Login' : 'Sign Up';
  }

  function submitForm() {
    const name = document.getElementById('name').value;
    const password = document.getElementById('password').value;
    const birth = document.getElementById('birth').value;

    if (isSignup) {
      if (!name || !password || !birth) {
        alert('Fill all fields');
        return;
      }
      localStorage.setItem('user', JSON.stringify({ name, password, birth }));
      alert('Signed up! Now log in.');
      toggleMode();
    } else {
      const user = JSON.parse(localStorage.getItem('user'));
      if (!user || user.password !== password) {
        alert('Invalid login');
        return;
      }
      showDashboard();
    }
  }

  function showDashboard() {
    document.getElementById('auth').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
  }

  function logout() {
    document.getElementById('auth').style.display = 'block';
    document.getElementById('dashboard').style.display = 'none';
  }
</script>

</body>
</html>

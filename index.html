<!DOCTYPE html>
<html>
<head>
  <title>Pixelia Worlds</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: #1e1e1e;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
      text-align: center;
    }

    h1 { margin-top: 30px; }

    .frame {
      width: 300px;
      margin: 80px auto;
      padding: 20px;
      background: #2b2b2b;
      border-radius: 10px;
      display: none;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 5px;
    }

    button {
      width: 95%;
      padding: 10px;
      margin-top: 10px;
      background: #4caf50;
      border: none;
      border-radius: 5px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #world {
      width: 100vw;
      height: 100vh;
      background: #3a3a3a;
      position: relative;
      display: none;
      overflow: hidden;
    }

    .player {
      width: 30px;
      height: 40px;
      background: #00aaff;
      position: absolute;
      border-radius: 5px;
    }

    /* CHAT TOP-RIGHT, MOBILE-FRIENDLY */
    #chatBox {
      position: fixed;
      top: 10px;
      right: 10px;
      width: 260px;
      max-width: 70vw;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      z-index: 9999;
    }

    #chatMessages {
      width: 100%;
      height: 140px;
      background: rgba(0,0,0,0.8);
      overflow-y: auto;
      padding: 8px;
      border-radius: 10px;
      font-size: 14px;
      color: white;
      backdrop-filter: blur(6px);
      box-sizing: border-box;
    }

    #chatInput {
      width: 100%;
      padding: 6px;
      margin-top: 6px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
    }

    #statusBar {
      position: fixed;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 9999;
    }

    /* LOGOUT UNDER CHAT */
    #logoutBtn {
      margin-top: 6px;
      width: 100%;
      padding: 6px;
      background: #d9534f;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      border: none;
    }

    /* JOYSTICKS / MOBILE CONTROLS (HIDDEN BY DEFAULT) */
    #leftJoystick,
    #jumpBtn {
      display: none;
    }

    #leftJoystick {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      touch-action: none;
      z-index: 9999;
    }

    #leftJoystickInner {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 60px;
      height: 60px;
      margin-left: -30px;
      margin-top: -30px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
    }

    #jumpBtn {
      position: fixed;
      bottom: 40px;
      right: 20px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #ffcc00;
      color: #000;
      font-size: 18px;
      border: none;
      z-index: 9999;
      touch-action: none;
    }

    @media (max-width: 600px) {
      #chatMessages {
        height: 110px;
        font-size: 13px;
      }
      #chatInput {
        font-size: 13px;
      }
      #leftJoystick {
        width: 100px;
        height: 100px;
      }
      #leftJoystickInner {
        width: 50px;
        height: 50px;
        margin-left: -25px;
        margin-top: -25px;
      }
      #jumpBtn {
        width: 80px;
        height: 80px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

<h1 id="title">Pixelia Worlds</h1>

<div id="menu" class="frame" style="display:block;">
  <button onclick="showFrame('signup')">Sign Up</button>
  <button onclick="showFrame('login')">Log In</button>
</div>

<div id="signup" class="frame">
  <h2>Create Account</h2>
  <input id="su_username" placeholder="Username">
  <input id="su_pass" type="password" placeholder="Password">
  <button onclick="signUp()">Create & Join</button>
  <button onclick="showFrame('menu')">Back</button>
</div>

<div id="login" class="frame">
  <h2>Log In</h2>
  <input id="li_username" placeholder="Username">
  <input id="li_pass" type="password" placeholder="Password">
  <button onclick="logIn()">Enter</button>
  <button onclick="showFrame('menu')">Back</button>
</div>

<div id="world">
  <div id="statusBar">Players online: <span id="playerCount">0</span>/10</div>

  <div id="chatBox">
    <div id="chatMessages"></div>
    <input id="chatInput" placeholder="Type message and press Enter">
    <button id="logoutBtn" onclick="logout()">Logout</button>
  </div>

  <!-- LEFT JOYSTICK (MOVE) -->
  <div id="leftJoystick">
    <div id="leftJoystickInner"></div>
  </div>

  <!-- RIGHT JUMP BUTTON -->
  <button id="jumpBtn">Jump</button>
</div>

<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCx4dKsPQ5ph7g7P6E7ZAv7NarT0uQhZGQ",
    authDomain: "pixeliaworlds.firebaseapp.com",
    projectId: "pixeliaworlds",
    storageBucket: "pixeliaworlds.appspot.com",
    messagingSenderId: "261360406874",
    appId: "1:261360406874:web:c516b77a56eb529cfea363",
    measurementId: "G-DRNSDL3LRD"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let currentUser = null;
  let players = {};
  let keys = {};
  let joystickDir = 0; // -1 left, 1 right, 0 idle

  const worldEl = document.getElementById("world");
  const chatInput = document.getElementById("chatInput");
  const chatMessages = document.getElementById("chatMessages");
  const playerCountSpan = document.getElementById("playerCount");

  const leftJoystick = document.getElementById("leftJoystick");
  const leftJoystickInner = document.getElementById("leftJoystickInner");
  const jumpBtn = document.getElementById("jumpBtn");

  // Special users with colors
  const specialUsers = {
    "noob": "purple",
    "Milk": "purple"
  };

  // Detect touch device -> show joysticks only on mobile
  function isTouchDevice() {
    return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  }

  if (isTouchDevice()) {
    leftJoystick.style.display = "block";
    jumpBtn.style.display = "block";
  }

  function showFrame(id) {
    document.querySelectorAll(".frame").forEach(f => f.style.display = "none");
    document.getElementById(id).style.display = "block";
  }

  async function hashPassword(password) {
    const msgUint8 = new TextEncoder().encode(password);
    const hashBuffer = await crypto.subtle.digest("SHA-256", msgUint8);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
  }

  async function signUp() {
    const username = su_username.value.trim();
    const pass = su_pass.value;

    if (!username || !pass) return alert("Fill everything");

    const accRef = db.ref("accounts/" + username);
    const snap = await accRef.once("value");
    if (snap.exists()) return alert("Username already taken");

    const hash = await hashPassword(pass);

    await accRef.set({
      username,
      passwordHash: hash
    });

    currentUser = username;
    startGame();
  }

  async function logIn() {
    const username = li_username.value.trim();
    const pass = li_pass.value;

    if (!username || !pass) return alert("Fill everything");

    const accRef = db.ref("accounts/" + username);
    const snap = await accRef.once("value");
    if (!snap.exists()) return alert("User not found");

    const data = snap.val();
    const hash = await hashPassword(pass);

    if (hash !== data.passwordHash) return alert("Wrong password");

    currentUser = username;
    startGame();
  }

  function logout() {
    if (currentUser) {
      db.ref("players/" + currentUser).remove();
    }
    currentUser = null;
    worldEl.style.display = "none";
    document.getElementById("title").style.display = "block";
    showFrame("menu");
  }

  async function startGame() {
    document.getElementById("title").style.display = "none";
    document.querySelectorAll(".frame").forEach(f => f.style.display = "none");
    worldEl.style.display = "block";

    const playersRef = db.ref("players");
    const snap = await playersRef.once("value");
    if (snap.numChildren() >= 10) {
      alert("Server full (10/10). Try later.");
      logout();
      return;
    }

    const playerRef = db.ref("players/" + currentUser);
    playerRef.set({ username: currentUser, x: 200, y: 400 });
    playerRef.onDisconnect().remove();

    db.ref("players").on("value", snap => {
      const data = snap.val() || {};
      playerCountSpan.textContent = Object.keys(data).length;

      for (let id in players) {
        if (!data[id]) {
          players[id].element.remove();
          delete players[id];
        }
      }

      for (let id in data) {
        const p = data[id];
        if (!players[id]) {
          players[id] = {
            x: p.x,
            y: p.y,
            vy: 0,
            onGround: true,
            username: p.username,
            element: createPlayerElement(p.username)
          };
        }
        players[id].x = p.x;
        players[id].y = p.y;
        updatePlayerPosition(players[id]);
      }
    });

    db.ref("chat").limitToLast(50).on("child_added", snap => {
      const msg = snap.val();
      const color = specialUsers[msg.username] || "white";
      const displayName = specialUsers[msg.username] ? "@" + msg.username : msg.username;
      addChatMessage(`<span style="color:${color}">${displayName}</span>: ${msg.text}`);
    });

    gameLoop();
  }

  function createPlayerElement(username) {
    const div = document.createElement("div");
    div.className = "player";

    const color = specialUsers[username] || "white";
    const displayName = specialUsers[username] ? "@" + username : username;

    div.innerHTML = `
      <span style="position:absolute;top:-18px;font-size:12px;color:${color};">
        ${displayName}
      </span>
    `;
    worldEl.appendChild(div);
    return div;
  }

  function updatePlayerPosition(p) {
    p.element.style.left = p.x + "px";
    p.element.style.top = p.y + "px";
  }

  document.addEventListener("keydown", e => {
    keys[e.key] = true;
    if (e.key === " " || e.code === "Space") {
      e.preventDefault();
      doJump();
    }
  });

  document.addEventListener("keyup", e => {
    keys[e.key] = false;
  });

  function doJump() {
    if (currentUser && players[currentUser]) {
      const me = players[currentUser];
      if (me.onGround) {
        me.vy = -11;
        me.onGround = false;
      }
    }
  }

  function gameLoop() {
    if (currentUser && players[currentUser]) {
      const me = players[currentUser];
      if (me.vy === undefined) me.vy = 0;
      if (me.onGround === undefined) me.onGround = true;

      let moved = false;

      const moveLeft = keys["a"] || keys["ArrowLeft"] || joystickDir === -1;
      const moveRight = keys["d"] || keys["ArrowRight"] || joystickDir === 1;

      if (moveLeft) { me.x -= 3; moved = true; }
      if (moveRight) { me.x += 3; moved = true; }

      me.vy += 0.6;
      me.y += me.vy;

      const groundY = 400;
      if (me.y >= groundY) {
        me.y = groundY;
        me.vy = 0;
        me.onGround = true;
      }

      updatePlayerPosition(me);

      if (moved || !me.onGround || me.vy !== 0) {
        db.ref("players/" + currentUser).update({ x: me.x, y: me.y });
      }
    }
    requestAnimationFrame(gameLoop);
  }

  chatInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && currentUser) {
      const text = chatInput.value.trim();
      if (!text) return;

      db.ref("chat").push({
        username: currentUser,
        text,
        ts: firebase.database.ServerValue.TIMESTAMP
      });

      chatInput.value = "";
    }
  });

  function addChatMessage(html) {
    const div = document.createElement("div");
    div.innerHTML = html;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  // JOYSTICK LOGIC (MOBILE ONLY)
  let joystickActive = false;
  let joystickCenter = { x: 0, y: 0 };

  leftJoystick.addEventListener("touchstart", e => {
    e.preventDefault();
    joystickActive = true;
    const rect = leftJoystick.getBoundingClientRect();
    joystickCenter.x = rect.left + rect.width / 2;
    joystickCenter.y = rect.top + rect.height / 2;
  }, { passive: false });

  leftJoystick.addEventListener("touchmove", e => {
    e.preventDefault();
    if (!joystickActive) return;
    const touch = e.touches[0];
    const dx = touch.clientX - joystickCenter.x;

    const maxDist = 40;
    let clampedDx = Math.max(-maxDist, Math.min(maxDist, dx));

    leftJoystickInner.style.transform = `translate(${clampedDx}px, 0px)`;

    if (clampedDx > 10) joystickDir = 1;
    else if (clampedDx < -10) joystickDir = -1;
    else joystickDir = 0;
  }, { passive: false });

  leftJoystick.addEventListener("touchend", e => {
    e.preventDefault();
    joystickActive = false;
    joystickDir = 0;
    leftJoystickInner.style.transform = "translate(0px, 0px)";
  }, { passive: false });

  jumpBtn.addEventListener("touchstart", e => {
    e.preventDefault();
    doJump();
  }, { passive: false });

  jumpBtn.addEventListener("click", () => {
    doJump();
  });
</script>

</body>
</html>
